 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Skills</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black text-white">
  <h1 class="text-center m-5">My Skills</h1>

  <div class="row">
    <!-- ================= FRONTEND ================= -->
    <div class="col-md-6">
      <p class="text-md-start fs-2 m-5 text-info">Frontend Development</p>

      <p class="mx-5">React / Next.js</p>
      <div class="progress mx-5" style="height: 20px;">
        <div class="progress-bar bg-primary text-white" role="progressbar" style="width: 60%;">
          60%
        </div>
      </div>

      <p class="mx-5">TypeScript</p>
      <div class="progress mx-5" style="height: 20px;">
        <div class="progress-bar bg-warning text-dark" role="progressbar" style="width: 75%;">
          75%
        </div>
      </div>

      <p class="mx-5">Tailwind CSS</p>
      <div class="progress mx-5" style="height: 20px;">
        <div class="progress-bar bg-success text-white" role="progressbar" style="width: 90%;">
          90%
        </div>
      </div>

      <p class="mx-5">JavaScript</p>
      <div class="progress mx-5" style="height: 20px;">
        <div class="progress-bar bg-danger text-white" role="progressbar" style="width: 55%;">
          55%
        </div>
      </div>
    </div>

    <!-- ================= BACKEND ================= -->
    <div class="col-md-6">
      <p class="text-md-start fs-2 m-5 text-info">Backend Development</p>

      <p class="mx-5">Node.js</p>
      <div class="progress mx-5" style="height: 20px;">
        <div class="progress-bar bg-success text-white" role="progressbar" style="width: 85%;">
          85%
        </div>
      </div>

      <p class="mx-5">Express</p>
      <div class="progress mx-5" style="height: 20px;">
        <div class="progress-bar bg-warning text-dark" role="progressbar" style="width: 75%;">
          75%
        </div>
      </div>

      <p class="mx-5">MongoDB</p>
      <div class="progress mx-5" style="height: 20px;">
        <div class="progress-bar bg-primary text-white" role="progressbar" style="width: 70%;">
          70%
        </div>
      </div>

      <p class="mx-5">REST APIs</p>
      <div class="progress mx-5" style="height: 20px;">
        <div class="progress-bar bg-danger text-white" role="progressbar" style="width: 85%;">
          85%
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
